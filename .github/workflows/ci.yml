name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secret scan · Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Secret scanning (BLOCKING) — no real credential may live in the tree.
      # Scans the checked-out working tree (--no-git) so the result is
      # deterministic and reflects exactly what would deploy.
      - name: Secret scan (gitleaks)
        run: |
          VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose --exit-code 1

      # --- Dependency / supply-chain audit (REPORT-ONLY) --------------------
      # Surfaces advisories on every run. It does NOT fail the build: the known
      # advisories are transitive through the Next.js/SSR build toolchain and
      # cannot be resolved without a framework major bump (out of scope). Track
      # them here and in docs/PRODUCTION_READINESS.md; revisit on dependency
      # upgrades. Runtime exposure is limited (build/SSR-time packages).
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Dependency audit (report-only)
        run: |
          echo "::group::Production dependency audit (advisory)"
          pnpm audit --prod --audit-level high || true
          echo "::endgroup::"
          echo "Dependency audit is advisory — see docs/PRODUCTION_READINESS.md for the tracked-advisories rationale."

      # --- Compose validation (BLOCKING) — every compose file must parse/merge.
      - name: Validate docker compose files
        run: |
          docker compose version
          # Dummy values satisfy the ${VAR:?} required-secret guards so config
          # can parse; nothing is started.
          export POSTGRES_PASSWORD=x AUTH_SECRET=0123456789012345678901234567890123 \
            S3_PUBLIC_ENDPOINT=https://files.example.com MINIO_ROOT_USER=k MINIO_ROOT_PASSWORD=s \
            WEB_ORIGIN=https://app.example.com NEXT_PUBLIC_APP_URL=https://app.example.com \
            SITE_ADDRESS=app.example.com BOOTSTRAP_ADMIN_EMAIL=a@b.c BOOTSTRAP_ADMIN_PASSWORD=pw
          for f in docker-compose.yml docker-compose.full.yml docker-compose.staging.yml; do
            echo "::group::$f"; docker compose -f "$f" config >/dev/null && echo "OK: $f"; echo "::endgroup::"
          done

  build:
    name: Lint · Typecheck · Tests (incl. MinIO) · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: influenceos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # Isolated CI database — never a real environment (finding #6).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/influenceos_test?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/influenceos_test?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-secret-value-at-least-16-chars
      AUTH_REFRESH_GRACE_MS: '2000'
      STORAGE_DRIVER: local
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INTERNAL_API_URL: http://localhost:4000
      # Real MinIO for the S3 storage round-trip integration test (finding #2).
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: influenceos

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Materialize a root .env so the workspace's `dotenv -e ../../.env`
      # scripts resolve identically to a developer machine. (Job env still wins,
      # so S3_TEST_ENDPOINT etc. reach the test process.)
      - name: Write .env
        run: |
          cat > .env <<EOF
          DATABASE_URL=${DATABASE_URL}
          DIRECT_DATABASE_URL=${DIRECT_DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          AUTH_SECRET=${AUTH_SECRET}
          AUTH_REFRESH_GRACE_MS=${AUTH_REFRESH_GRACE_MS}
          STORAGE_DRIVER=${STORAGE_DRIVER}
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          INTERNAL_API_URL=${INTERNAL_API_URL}
          EOF

      - name: Start MinIO (private object storage)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break || sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live || { echo "MinIO failed"; docker logs minio; exit 1; }

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations
        run: pnpm db:deploy

      - name: Create the private bucket
        run: |
          node -e '
            const { S3Client, CreateBucketCommand } = require("@aws-sdk/client-s3");
            const c = new S3Client({ endpoint: "http://localhost:9000", region: "us-east-1", forcePathStyle: true, credentials: { accessKeyId: "minioadmin", secretAccessKey: "minioadmin" } });
            c.send(new CreateBucketCommand({ Bucket: "influenceos" })).then(() => console.log("bucket created")).catch(e => (e.name === "BucketAlreadyOwnedByYou" ? console.log("bucket exists") : Promise.reject(e)));
          '

      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests (incl. real MinIO S3 round-trip)
        run: pnpm test:integration
      - name: Contract tests
        run: pnpm test:contract
      - name: DoD scenario (API)
        run: pnpm test:dod

      - name: Build
        run: pnpm build

  images:
    name: Build production images (api · worker · web)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: influenceos-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          load: true
          tags: influenceos-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          load: true
          tags: influenceos-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Smoke the API image (env fail-fast is enforced in the built image)
        run: |
          # Starting the API image with NO mandatory env must exit non-zero
          # (fail-fast) and print the config report — proving the env contract
          # ships enforced. A clean start would instead hang waiting for a DB.
          set +e
          OUT=$(docker run --rm -e NODE_ENV=production influenceos-api:ci 2>&1)
          CODE=$?
          echo "$OUT"
          if [ "$CODE" -eq 0 ]; then echo "Expected non-zero exit on missing env"; exit 1; fi
          echo "$OUT" | grep -qi "Invalid API environment configuration" \
            || { echo "Image did not fail-fast with the expected config report"; exit 1; }
          echo "API image enforces the env contract at startup."

  e2e:
    name: Full stack E2E (pg · redis · minio · api · worker · web)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: influenceos_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/influenceos_e2e?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/influenceos_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-secret-value-at-least-16-chars
      STORAGE_DRIVER: local
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INTERNAL_API_URL: http://localhost:4000
      API_PORT: '4000'
      API_HOST: 0.0.0.0
      WORKER_PORT: '4100'
      WEB_ORIGIN: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      MONITOR_CRON: '*/1 * * * *'
      CI: 'true'
      # Real MinIO for the object-storage round-trip (verifies storage in-stack).
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: influenceos

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break || sleep 1; done
          curl -sf http://localhost:9000/minio/health/live || { echo "MinIO failed"; docker logs minio; exit 1; }

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations
        run: pnpm db:deploy
      - name: Create the private bucket
        run: |
          node -e '
            const { S3Client, CreateBucketCommand } = require("@aws-sdk/client-s3");
            const c = new S3Client({ endpoint: "http://localhost:9000", region: "us-east-1", forcePathStyle: true, credentials: { accessKeyId: "minioadmin", secretAccessKey: "minioadmin" } });
            c.send(new CreateBucketCommand({ Bucket: "influenceos" })).then(() => console.log("bucket created")).catch(e => (e.name === "BucketAlreadyOwnedByYou" ? console.log("bucket exists") : Promise.reject(e)));
          '
      - name: Write .env
        run: |
          cat > .env <<EOF
          DATABASE_URL=${DATABASE_URL}
          DIRECT_DATABASE_URL=${DIRECT_DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          AUTH_SECRET=${AUTH_SECRET}
          STORAGE_DRIVER=${STORAGE_DRIVER}
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          INTERNAL_API_URL=${INTERNAL_API_URL}
          EOF
      - name: Seed demo data
        run: SEED_DEMO=true CONFIRM_WIPE=true pnpm --filter @influenceos/database exec tsx prisma/seed.ts

      - name: Object storage round-trip (MinIO)
        run: pnpm --filter @influenceos/api exec vitest run test/integration/s3-storage.test.ts

      - name: Build web
        run: pnpm --filter @influenceos/web build
      - name: Install Playwright browser
        run: pnpm --filter @influenceos/web exec playwright install --with-deps chromium

      - name: Start API
        run: |
          pnpm --filter @influenceos/api exec tsx src/index.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/health && break; sleep 1; done
          curl -sf http://localhost:4000/health || { echo "API failed"; cat /tmp/api.log; exit 1; }

      - name: Start worker (health + deterministic sweep)
        run: |
          pnpm --filter @influenceos/worker exec tsx src/index.ts > /tmp/worker.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4100/health && break; sleep 1; done
          curl -sf http://localhost:4100/health || { echo "Worker failed to start"; cat /tmp/worker.log; exit 1; }
          # Deterministic worker-driven operation: wait until a maintenance sweep runs.
          for i in $(seq 1 90); do
            curl -sf http://localhost:4100/health | grep -q '"lastMaintenanceAt":"' && break || sleep 1
          done
          H=$(curl -sf http://localhost:4100/health)
          echo "worker health: $H"
          echo "$H" | grep -q '"mode":"redis+bullmq"' || { echo "worker not on redis+bullmq"; cat /tmp/worker.log; exit 1; }
          echo "$H" | grep -q '"lastMaintenanceAt":"' || { echo "worker never completed a sweep"; cat /tmp/worker.log; exit 1; }

      - name: Start web
        run: |
          pnpm --filter @influenceos/web start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/login && break; sleep 1; done
          curl -sf http://localhost:3000/login || { echo "Web failed"; cat /tmp/web.log; exit 1; }

      - name: Run Playwright E2E (smoke + full browser DoD)
        run: pnpm --filter @influenceos/web exec playwright test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  e2e-s3:
    name: Browser S3 E2E (DoD journey against MinIO/S3)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: influenceos_e2e_s3
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/influenceos_e2e_s3?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/influenceos_e2e_s3?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-secret-value-at-least-16-chars
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INTERNAL_API_URL: http://localhost:4000
      API_PORT: '4000'
      API_HOST: 0.0.0.0
      WORKER_PORT: '4100'
      WEB_ORIGIN: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      CI: 'true'
      # The whole stack runs on the S3 driver so the browser exercises presigned
      # PUT/GET against MinIO (internal == public endpoint on localhost in CI).
      STORAGE_DRIVER: s3
      S3_INTERNAL_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: influenceos
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Start MinIO
        run: |
          # MINIO_API_CORS_ALLOW_ORIGIN="*" makes MinIO answer the browser's
          # cross-origin presigned PUT/GET preflight — required for the browser
          # to upload directly to object storage from the web origin.
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            -e MINIO_API_CORS_ALLOW_ORIGIN="*" \
            minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break || sleep 1; done
          curl -sf http://localhost:9000/minio/health/live || { echo "MinIO failed"; docker logs minio; exit 1; }

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations
        run: pnpm db:deploy
      - name: Create the private bucket
        run: |
          node -e '
            const { S3Client, CreateBucketCommand } = require("@aws-sdk/client-s3");
            const c = new S3Client({ endpoint: "http://localhost:9000", region: "us-east-1", forcePathStyle: true, credentials: { accessKeyId: "minioadmin", secretAccessKey: "minioadmin" } });
            c.send(new CreateBucketCommand({ Bucket: "influenceos" })).then(() => console.log("bucket created")).catch(e => (e.name === "BucketAlreadyOwnedByYou" ? console.log("bucket exists") : Promise.reject(e)));
          '
      - name: Write .env (S3 driver)
        run: |
          cat > .env <<EOF
          DATABASE_URL=${DATABASE_URL}
          DIRECT_DATABASE_URL=${DIRECT_DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          AUTH_SECRET=${AUTH_SECRET}
          STORAGE_DRIVER=s3
          S3_INTERNAL_ENDPOINT=${S3_INTERNAL_ENDPOINT}
          S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT}
          S3_REGION=${S3_REGION}
          S3_BUCKET=${S3_BUCKET}
          S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
          S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
          S3_FORCE_PATH_STYLE=true
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          INTERNAL_API_URL=${INTERNAL_API_URL}
          EOF
      - name: Seed demo data
        run: SEED_DEMO=true CONFIRM_WIPE=true pnpm --filter @influenceos/database exec tsx prisma/seed.ts

      - name: Build web
        run: pnpm --filter @influenceos/web build
      - name: Install Playwright browser
        run: pnpm --filter @influenceos/web exec playwright install --with-deps chromium

      - name: Start API (S3 driver)
        run: |
          pnpm --filter @influenceos/api exec tsx src/index.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/health && break; sleep 1; done
          curl -sf http://localhost:4000/health || { echo "API failed"; cat /tmp/api.log; exit 1; }
      - name: Start web
        run: |
          pnpm --filter @influenceos/web start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/login && break; sleep 1; done
          curl -sf http://localhost:3000/login || { echo "Web failed"; cat /tmp/web.log; exit 1; }

      # The DoD journey uploads → lists → downloads (signed) → deletes an
      # attachment through the browser; on this stack that path is presigned
      # PUT/GET against MinIO, proving browser object storage end-to-end.
      - name: Run browser S3 journey (DoD spec)
        run: pnpm --filter @influenceos/web exec playwright test dod.spec.ts

      - name: Diagnostics on failure
        if: ${{ failure() }}
        run: |
          echo "===== MinIO container logs (CORS / PUT errors) ====="; docker logs minio 2>&1 | tail -80 || true
          echo "===== API log ====="; tail -60 /tmp/api.log || true
          echo "===== web log ====="; tail -40 /tmp/web.log || true

      - name: Upload Playwright traces/report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-s3
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
