# ---------------------------------------------------------------------------
# InfluenceOS — Nginx reverse proxy (alternative to Caddy)
#
# Use this if your platform standardises on Nginx. Unlike Caddy, TLS
# certificates are NOT automatic — obtain them with certbot (Let's Encrypt) and
# point ssl_certificate / ssl_certificate_key at the issued files, or terminate
# TLS at a managed load balancer and forward to this server over the private
# network.
#
# Expose ONLY 80/443 publicly. Upstreams (api:4000, web:3000) listen on the
# private network only.
# ---------------------------------------------------------------------------

upstream influenceos_web {
    server web:3000;
    keepalive 32;
}

upstream influenceos_api {
    server api:4000;
    keepalive 32;
}

# Redirect all plaintext traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name influenceos.example.com;

    # Allow the ACME http-01 challenge through if using certbot webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name influenceos.example.com;

    # --- TLS (replace with your issued certificate paths) -------------------
    ssl_certificate     /etc/letsencrypt/live/influenceos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/influenceos.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers (defence in depth with the app's own headers) -----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # Upload ceiling at the edge (keep >= MAX_UPLOAD_MB).
    client_max_body_size 120m;

    # Common proxy headers.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # --- Versioned API + docs → API service --------------------------------
    location /api/v1/       { proxy_pass http://influenceos_api; }
    location /api/docs      { proxy_pass http://influenceos_api; }
    location = /api/openapi.json { proxy_pass http://influenceos_api; }

    # --- Everything else → Next.js web app (SSR + BFF) ---------------------
    location / {
        proxy_pass http://influenceos_web;
    }
}
