x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/influenceos
  DIRECT_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/influenceos
  REDIS_URL: redis://redis:6379
  AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required (min 16 chars)}
  STORAGE_DRIVER: s3
  S3_INTERNAL_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: us-east-1
  S3_BUCKET: influenceos
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  S3_FORCE_PATH_STYLE: 'true'
  MAX_UPLOAD_MB: '50'
  # Optional settings, passed through from .env when set (empty = not set):
  # a separate encryption key for stored secrets, email, the uptime ping, the
  # API docs switch, and a fallback Claude key/model for Settings → AI.
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  APP_URL: ${APP_URL:-}
  HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
  API_DOCS: ${API_DOCS:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: influenceos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Single object-storage pin, overridable via MINIO_IMAGE. Default: MinIO +
    # mc built from the upstream release tags by CI (docker/minio/) into this
    # repo's public GHCR package. Works on CPUs without AVX (see .env.example).
    image: ${MINIO_IMAGE:-ghcr.io/hisham7961/influenceos-minio:RELEASE.2022-10-24T18-35-07Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    pull_policy: build
    environment:
      <<: *app-env
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-info@influence-op.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required in production}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      /bin/sh -c "
      pnpm --filter @influenceos/database exec prisma migrate deploy &&
      pnpm --filter @influenceos/database exec tsx prisma/bootstrap.ts
      "
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    pull_policy: build
    environment:
      <<: *app-env
      API_PORT: '4000'
      API_HOST: 0.0.0.0
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    pull_policy: build
    environment:
      <<: *app-env
      WORKER_PORT: '4100'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    pull_policy: build
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  miniodata:
