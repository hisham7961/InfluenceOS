# Full InfluenceOS stack — Postgres, Redis, MinIO, API, worker and web together.
#
#   docker compose -f docker-compose.full.yml up --build
#
# The `migrate` one-shot applies migrations and bootstraps a first admin from
# BOOTSTRAP_ADMIN_* before the app services start. Object storage is PRIVATE
# (S3 driver against MinIO) — no anonymous access; downloads use presigned URLs.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/influenceos
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/influenceos
  REDIS_URL: redis://redis:6379
  AUTH_SECRET: ${AUTH_SECRET:-please-change-me-in-production-01}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: influenceos
  S3_ACCESS_KEY_ID: minioadmin
  S3_SECRET_ACCESS_KEY: minioadmin
  S3_FORCE_PATH_STYLE: 'true'
  MAX_UPLOAD_MB: '50'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: influenceos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Create the PRIVATE bucket (no `mc anonymous set` — objects stay private).
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do echo 'waiting for minio'; sleep 2; done;
      mc mb --ignore-existing local/influenceos;
      exit 0;
      "

  # One-shot: apply migrations, then bootstrap a first admin (idempotent).
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      <<: *app-env
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@influenceos.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      /bin/sh -c "
      pnpm --filter @influenceos/database exec prisma migrate deploy &&
      pnpm --filter @influenceos/database exec tsx prisma/bootstrap.ts
      "
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      <<: *app-env
      API_PORT: '4000'
      API_HOST: 0.0.0.0
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:4000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
