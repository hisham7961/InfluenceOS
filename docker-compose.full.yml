# Full InfluenceOS stack — Postgres, Redis, MinIO, API, worker and web together,
# with PRODUCTION semantics: no insecure fallback secrets. Every credential must
# be supplied from the environment or this stack refuses to start.
#
#   AUTH_SECRET=... POSTGRES_PASSWORD=... MINIO_ROOT_PASSWORD=... \
#   BOOTSTRAP_ADMIN_EMAIL=... BOOTSTRAP_ADMIN_PASSWORD=... \
#   docker compose -f docker-compose.full.yml up --build
#
# The `migrate` one-shot applies migrations and bootstraps a first admin before
# the app services start. Object storage is PRIVATE (S3 driver against MinIO);
# the browser reaches presigned URLs at S3_PUBLIC_ENDPOINT while the API/worker
# use the internal service DNS name.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/influenceos
  DIRECT_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/influenceos
  REDIS_URL: redis://redis:6379
  AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required (min 16 chars)}
  STORAGE_DRIVER: s3
  S3_INTERNAL_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: us-east-1
  S3_BUCKET: influenceos
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  S3_FORCE_PATH_STYLE: 'true'
  MAX_UPLOAD_MB: '50'
  # Where the API probes the worker's health for the status page (internal DNS).
  WORKER_HEALTH_URL: http://worker:4100/health
  # Release identity surfaced on /health and Settings → Platform (never secrets).
  # Export these before `up` to stamp the running build, e.g.
  #   export GIT_SHA=$(git rev-parse HEAD)
  GIT_SHA: ${GIT_SHA:-}
  APP_VERSION: ${APP_VERSION:-}
  BUILD_TIME: ${BUILD_TIME:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: influenceos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO + mc built from the upstream release tags by CI (docker/minio/) and
    # published to this repo's public GHCR package (the archived project is no
    # longer served anonymously elsewhere). Same release the production server
    # runs (works without AVX, supports CORS). Override MINIO_IMAGE only to pin
    # a different build — see .env.example.
    image: ${MINIO_IMAGE:-ghcr.io/hisham7961/influenceos-minio:RELEASE.2022-10-24T18-35-07Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    # Bound to loopback only — the API/worker reach MinIO over the internal
    # Docker network (minio:9000), never the host port. Never expose the object
    # store or its console to the public internet. To serve presigned URLs to
    # browsers, front MinIO with the reverse proxy (TLS) and set
    # S3_PUBLIC_ENDPOINT to that URL.
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      # curl ships in the default image; `mc ready` covers an official image override.
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live || mc ready local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Create the PRIVATE bucket (no `mc anonymous set` — objects stay private).
  minio-setup:
    image: ${MINIO_MC_IMAGE:-ghcr.io/hisham7961/influenceos-minio:RELEASE.2022-10-24T18-35-07Z}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do echo 'waiting for minio'; sleep 2; done;
      mc mb --ignore-existing local/influenceos;
      exit 0;
      "

  # One-shot: apply migrations, then bootstrap a first admin (idempotent).
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      <<: *app-env
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-info@influence-op.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required in production}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      /bin/sh -c "
      pnpm --filter @influenceos/database exec prisma migrate deploy &&
      pnpm --filter @influenceos/database exec tsx prisma/bootstrap.ts
      "
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *app-env
      API_PORT: '4000'
      API_HOST: 0.0.0.0
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    # The API is NOT published to the host (SEC-06/A6-F5): the web app reaches it
    # over the internal Docker network via INTERNAL_API_URL, and the browser
    # never talks to it directly. Only the web service is host-published.
    expose:
      - '4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:4000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_PORT: '4100'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:4100/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:4000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
